name: Native gems

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-24.04
          - name: aarch64-linux
            os: ubuntu-24.04-arm
          - name: arm64-darwin
            os: macos-15
          - name: x86_64-darwin
            os: macos-15-intel
          - name: x64-mingw-ucrt
            os: windows-2025

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake native:package
      - uses: actions/upload-artifact@v6
        with:
          name: box2d-ruby-${{ matrix.name }}
          path: pkg/*.gem
          if-no-files-found: error
